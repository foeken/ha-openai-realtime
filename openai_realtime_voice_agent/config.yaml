name: OpenAI Realtime Voice Agent
version: "0.2.7"
slug: openai_realtime_voice_agent
description: Voice control using OpenAI Realtime API with WebSocket support for ESP32 devices
url: https://github.com/foeken/ha-openai-realtime
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
options:
  openai_api_key: ""
  websocket_port: 8080
  ha_mcp_url: ""
  longlived_token: ""
  # Turn detection settings
  vad_threshold: 0.5
  vad_prefix_padding_ms: 300
  vad_silence_duration_ms: 500
  vad_idle_timeout_ms: 0
  # OpenAI Realtime settings
  openai_realtime_model: "gpt-realtime-2"
  openai_realtime_voice: "cedar"
  openai_transcription_model: "gpt-realtime-whisper"
  openai_noise_reduction: "far_field"
  # OpenAI instructions
  instructions: "You are the Home Assistant Voice Agent and can control the smart home. Respond in English unless the user explicitly asks for another language. Hey Mycroft is currently disabled on the ESP client because the V2 wake-word model tensor arena no longer fits after tensor-size changes. When a tool is needed, call the tool without filler like 'let me check', then speak a concise answer after the tool result returns."
  # Agent routing
  default_agent: "default"
  wake_word_agent_map: '{"hey_jarvis":"jarvis","okay_nabu":"nabu"}'
  agent_prompts_json: ""
  agents_json: ""
  client_metadata_timeout_seconds: 1.0
  auto_disconnect_after_response_seconds: 5.0
  # Session management
  session_reuse_timeout_seconds: 300
  # Audio recording (optional, for debugging)
  enable_recording: false
schema:
  openai_api_key: password
  websocket_port: int(1024,65535)
  ha_mcp_url: str
  longlived_token: password
  vad_threshold: float(0.0,1.0)
  vad_prefix_padding_ms: int
  vad_silence_duration_ms: int
  vad_idle_timeout_ms: int
  openai_realtime_model: str
  openai_realtime_voice: str
  openai_transcription_model: str
  openai_noise_reduction: str
  instructions: str
  default_agent: str
  wake_word_agent_map: str
  agent_prompts_json: str
  agents_json: str
  client_metadata_timeout_seconds: float(0.0,5.0)
  auto_disconnect_after_response_seconds: float(-1.0,30.0)
  session_reuse_timeout_seconds: int(0,3600)
  enable_recording: bool
image: ghcr.io/foeken/ha-openai-realtime/openai-realtime-voice-agent-{arch}
